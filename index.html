<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe6ee">
<meta name="robots" content="noindex, nofollow">
<title>💌 For you</title>
<meta property="og:type" content="website">
<meta property="og:title" content="A little letter for you 💌">
<meta property="og:description" content="Open it 🙈">
<meta property="og:url" content="https://ayoubzeroual6.github.io/little-letter/">
<meta property="og:image" content="https://ayoubzeroual6.github.io/little-letter/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a2338;
  --ink-soft:#8d5f75;
  --pink:#ff5d8f;
  --pink-deep:#e2437a;
  --pink-soft:#ffc2d4;
  --pink-line:#ffd6e2;
  --pink-pale:#ffe3ec;
  --paper:#fffdfb;
  --round:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%;height:100%}
body{
  height:100%;
  font-family:var(--round);
  color:var(--ink);
  background-color:#fff4f6;
  background-image:radial-gradient(120% 70% at 50% -10%, #ffdbe6 0%, rgba(255,219,230,0) 60%),
                   radial-gradient(90% 60% at 100% 110%, #ffe9dc 0%, rgba(255,233,220,0) 60%);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[tabindex="-1"]:focus{outline:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

/* ---------- floating hearts ---------- */
.bg-hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-hearts span{position:absolute;bottom:-40px;width:var(--s);height:var(--s);color:var(--pink-soft);animation:floatUp linear infinite}
.bg-hearts svg{width:100%;height:100%;fill:currentColor}
@keyframes floatUp{
  0%{transform:translate(0,0) rotate(-10deg)}
  50%{transform:translate(14px,-55vh) rotate(8deg)}
  100%{transform:translate(-8px,-115vh) rotate(-6deg)}
}

/* ---------- screens ---------- */
.screen{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(26px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  opacity:0;visibility:hidden;transform:translateY(20px) scale(.98);
  transition:opacity .45s ease, transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s linear .6s;
}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease .12s, transform .65s cubic-bezier(.2,.8,.2,1) .12s, visibility 0s}
.screen.leaving{opacity:0;transform:translateY(-20px) scale(.98)}
.card{width:100%;max-width:420px;margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

.label{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--pink-deep);background:var(--pink-pale);padding:7px 14px;border-radius:999px}
.title{font-size:clamp(1.9rem, 8.6vw, 2.55rem);line-height:1.08;font-weight:700;letter-spacing:-.01em;text-wrap:balance;max-width:14em}
.subtitle{font-size:1.04rem;line-height:1.4;color:var(--ink-soft);max-width:31ch;text-wrap:balance;white-space:pre-line}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 32px;border-radius:999px;font-size:1.18rem;font-weight:600;text-decoration:none;transition:transform .18s ease, box-shadow .18s ease}
.btn-yes{background:linear-gradient(180deg,#ff7aa3,#ff4d85);color:#fff;box-shadow:0 7px 0 #d23a6b, 0 14px 26px rgba(226,67,122,.32)}
.btn-yes:active{transform:translateY(4px);box-shadow:0 3px 0 #d23a6b, 0 8px 16px rgba(226,67,122,.28)}
.btn-yes.pulse{animation:pulse .5s ease}
.btn-block{width:100%}
.btn-wa{background:linear-gradient(180deg,#3fdc86,#20bd68);color:#fff;box-shadow:0 7px 0 #169351, 0 14px 24px rgba(32,189,104,.28)}
.btn-wa:active{transform:translateY(4px);box-shadow:0 3px 0 #169351}
.link-btn{font-size:.86rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:10px}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s ease}

/* ---------- mascot ---------- */
.mascot{width:128px;animation:bob 2.8s ease-in-out infinite}
.mascot svg{display:block;width:100%;height:auto;overflow:visible}
.mascot.small{width:104px}
.mascot.wobble{animation:wobble .5s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}}

/* ---------- 1. envelope ---------- */
.env-stage{width:100%;display:flex;flex-direction:column;align-items:center;gap:22px}
.envelope{position:relative;display:block;width:min(78vw,320px);aspect-ratio:29/20;margin-top:clamp(84px,30vw,128px);filter:drop-shadow(0 16px 22px rgba(226,67,122,.22))}
.envelope:not(.open){animation:wiggle 3.6s ease-in-out infinite}
.env-back,.env-front{position:absolute;inset:0;width:100%;height:100%;display:block}
.env-back{z-index:1}
.letter{position:absolute;left:7%;right:7%;top:5%;height:88%;z-index:2;transition:transform .85s cubic-bezier(.2,.8,.2,1) .45s}
.letter-paper{width:100%;height:100%;background:var(--paper);border:2px solid var(--pink-line);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:9% 10% 0}
.letter-to{font-family:var(--hand);font-weight:700;font-size:1.55rem;line-height:1}
.letter-line{display:block;width:78%;height:6px;border-radius:3px;background:var(--pink-pale)}
.letter-line.short{width:52%}
.letter-heart{width:22px;height:22px;fill:var(--pink)}
.env-front{z-index:3;pointer-events:none}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:50% 0;transition:transform .6s cubic-bezier(.45,0,.25,1)}
.flap svg{display:block;width:100%;height:100%}
.flap path{fill:#ffd2df;stroke:#f6b3c8;stroke-width:2;transition:fill .3s}
.flap.behind{z-index:1}
.flap.behind path{fill:#f8bfd1}
.seal{position:absolute;left:50%;top:53%;width:58px;height:58px;margin:-29px 0 0 -29px;z-index:5;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ffa2bf,#ff5d8f 55%,#dc3d74);
  box-shadow:0 4px 10px rgba(220,61,116,.45), inset 0 -3px 6px rgba(0,0,0,.12), inset 0 2px 3px rgba(255,255,255,.45);
  transition:transform .35s cubic-bezier(.5,-.6,.5,1.6), opacity .3s;animation:beat 1.7s ease-in-out infinite}
.seal svg{width:26px;height:26px;fill:#fff}
.envelope.open .seal{animation:none;transform:scale(0) rotate(-40deg);opacity:0}
.envelope.open .flap{transform:perspective(800px) rotateX(180deg)}
.envelope.open .letter{transform:translateY(-60%)}
.tap-hint{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.84rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);transition:opacity .3s}
.tap-hint .arrow{color:var(--pink);font-size:1.2rem;animation:nudge 1.4s ease-in-out infinite}
.wink{font-family:var(--hand);font-weight:700;font-size:1.55rem;line-height:1.15;color:var(--pink-deep);max-width:22ch;transform:rotate(-2deg);text-wrap:balance;transition:opacity .3s}
.env-stage.opened .tap-hint,.env-stage.opened .wink{opacity:0}
@keyframes wiggle{0%,76%,100%{transform:rotate(0)}80%{transform:rotate(-3deg)}84%{transform:rotate(3deg)}88%{transform:rotate(-2deg)}92%{transform:rotate(1deg)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- 2. question ---------- */
.choices{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px;min-height:64px}
.btn-no{position:relative;z-index:20;background:#fff;color:var(--ink-soft);border:2.5px solid var(--pink-soft);box-shadow:0 6px 0 var(--pink-line);
  transform:translate(var(--nx,0px),var(--ny,0px));transition:transform .42s cubic-bezier(.34,1.5,.64,1), background .2s, color .2s, border-color .2s, box-shadow .2s}
.btn-no.turned{background:linear-gradient(180deg,#ff7aa3,#ff4d85);color:#fff;border-color:transparent;box-shadow:0 7px 0 #d23a6b, 0 14px 26px rgba(226,67,122,.32)}
.btn-no.turning{animation:turn .36s ease}
@keyframes turn{0%{scale:1 1}50%{scale:0 1}100%{scale:1 1}}
.no-msg{min-height:2.3em;font-family:var(--hand);font-weight:700;font-size:1.55rem;line-height:1.1;color:var(--pink-deep);max-width:22ch;text-wrap:balance}
.no-msg.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- 3. plan ---------- */
.day-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px dashed var(--pink-soft);border-radius:16px;padding:10px 16px;font-weight:600;font-size:1.02rem}
.section-label{margin-top:8px;font-size:.8rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft)}
.options{display:grid;gap:12px;width:100%}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2.5px solid var(--pink-line);border-radius:20px;padding:13px 14px;box-shadow:0 5px 0 var(--pink-pale);transition:border-color .2s, background .2s, transform .2s, box-shadow .2s}
.opt-emoji{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:15px;background:#fff0f5;font-size:1.8rem}
.opt-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opt-text strong{font-size:1.08rem;font-weight:600;line-height:1.2}
.opt-text small{font-size:.86rem;color:var(--ink-soft)}
.opt-text em{font-style:normal;font-family:var(--hand);font-weight:700;font-size:1.15rem;line-height:1.1;color:var(--pink-deep)}
.opt-check{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--pink-soft);color:transparent;font-size:.85rem;font-weight:700;transition:.2s}
.opt[aria-checked="true"]{border-color:var(--pink);background:#fff6f9;box-shadow:0 5px 0 var(--pink-soft);transform:translateY(-2px)}
.opt[aria-checked="true"] .opt-check{background:var(--pink);border-color:var(--pink);color:#fff}
.times{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.time{min-width:104px;min-height:52px;padding:0 18px;border-radius:16px;background:#fff;border:2.5px solid var(--pink-line);box-shadow:0 4px 0 var(--pink-pale);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;transition:.2s}
.time[aria-checked="true"]{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 0 #d23a6b;transform:translateY(-2px)}
.time:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.back-note{font-family:var(--hand);font-weight:700;font-size:1.3rem;line-height:1.1;color:var(--ink-soft);transform:rotate(-1.5deg)}
.plan-hint{min-height:1.4em;font-weight:500;color:var(--pink-deep)}

/* ---------- 4. final ---------- */
.recap{width:100%;background:#fff;border:2.5px solid var(--pink-line);border-radius:22px;box-shadow:0 6px 0 var(--pink-pale);padding:4px 16px;text-align:left}
.recap-row{display:flex;align-items:center;gap:14px;padding:12px 0}
.recap-row + .recap-row{border-top:2px dashed var(--pink-pale)}
.recap-row .opt-emoji{width:46px;height:46px;font-size:1.6rem}
.recap-row strong{display:block;font-size:1.08rem;font-weight:600;line-height:1.2}
.recap-row small{display:block;font-size:.88rem;color:var(--ink-soft)}
.countdown{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.countdown div{display:flex;flex-direction:column;align-items:center;background:#fff;border:2.5px solid var(--pink-line);border-radius:18px;padding:10px 4px 8px}
.countdown b{font-size:2rem;font-weight:700;line-height:1.1;color:var(--pink-deep);font-variant-numeric:tabular-nums}
.countdown span{font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.countdown-done{font-family:var(--hand);font-weight:700;font-size:1.8rem;color:var(--pink-deep)}
.closing{font-family:var(--hand);font-weight:700;font-size:1.6rem;line-height:1.15;max-width:24ch;text-wrap:balance;white-space:pre-line}
.signature{font-family:var(--hand);font-weight:700;font-size:1.5rem;color:var(--pink-deep);margin-top:-10px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (prefers-reduced-motion: reduce){
  .bg-hearts,.mascot,.envelope:not(.open),.seal,.tap-hint .arrow{animation:none!important}
}
</style>
</head>
<body>
<div class="bg-hearts" aria-hidden="true"></div>

<main>
  <!-- 1. Envelope -->
  <section class="screen active" id="s-envelope" aria-label="Letter">
    <div class="card">
      <p class="label" data-t="p1.label"></p>
      <div class="env-stage" id="env-stage">
        <button class="envelope" id="envelope" type="button" aria-label="Open the letter">
          <svg class="env-back" viewBox="0 0 290 200" preserveAspectRatio="none" aria-hidden="true">
            <rect width="290" height="200" rx="18" fill="#f7bfd0"/>
          </svg>
          <span class="letter" aria-hidden="true">
            <span class="letter-paper">
              <span class="letter-to" data-t="letter"></span>
              <span class="letter-line"></span>
              <span class="letter-line short"></span>
              <svg class="letter-heart" viewBox="0 0 24 24"><use href="#heart"/></svg>
            </span>
          </span>
          <svg class="env-front" viewBox="0 0 290 200" preserveAspectRatio="none" aria-hidden="true">
            <defs><clipPath id="env-clip"><rect width="290" height="200" rx="18"/></clipPath></defs>
            <g clip-path="url(#env-clip)">
              <path d="M0 0 L145 108 L290 0 V200 H0 Z" fill="#ffe3eb"/>
              <path d="M2 198 L128 100 M288 198 L162 100" stroke="#f9c5d5" stroke-width="3" stroke-linecap="round" fill="none"/>
            </g>
          </svg>
          <span class="flap" id="flap" aria-hidden="true">
            <svg viewBox="0 0 290 116" preserveAspectRatio="none"><path d="M18 1 H272 Q289 1 289 18 L160 106 Q145 116 130 106 L1 18 Q1 1 18 1 Z"/></svg>
          </span>
          <span class="seal" id="seal" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></span>
        </button>
        <p class="tap-hint"><span class="arrow" aria-hidden="true">↑</span><span data-t="p1.tap_hint"></span></p>
        <p class="wink" data-t="p1.wink"></p>
      </div>
    </div>
  </section>

  <!-- 2. Question -->
  <section class="screen" id="s-question" aria-label="Question">
    <div class="card">
      <p class="label" data-t="p2.label"></p>
      <div class="mascot" id="mascot-q" aria-hidden="true"></div>
      <h1 class="title" tabindex="-1" data-t="p2.title"></h1>
      <p class="subtitle" data-t="p2.subtitle"></p>
      <div class="choices">
        <button class="btn btn-yes" id="btn-yes" type="button" data-t="p2.yes"></button>
        <button class="btn btn-no" id="btn-no" type="button" data-t="p2.no"></button>
      </div>
      <p class="no-msg" id="no-msg" aria-live="polite"></p>
    </div>
  </section>

  <!-- 3. Plan -->
  <section class="screen" id="s-plan" aria-label="The plan">
    <div class="card">
      <p class="label" data-t="p3.label"></p>
      <h1 class="title" tabindex="-1" data-t="p3.title"></h1>
      <p class="subtitle" data-t="p3.intro"></p>
      <p class="day-chip"><span aria-hidden="true">📅</span><span id="day-label"></span></p>
      <h2 class="section-label" id="opt-label" data-t="p3.options_label"></h2>
      <div class="options" id="options" role="radiogroup" aria-labelledby="opt-label"></div>
      <h2 class="section-label" id="time-label" data-t="p3.time_label"></h2>
      <div class="times" id="times" role="radiogroup" aria-labelledby="time-label"></div>
      <p class="back-note" data-t="p3.back_note"></p>
      <p class="plan-hint" id="plan-hint" aria-live="polite"></p>
      <button class="btn btn-yes btn-block" id="btn-confirm" type="button" data-t="p3.confirm"></button>
    </div>
  </section>

  <!-- 4. Final -->
  <section class="screen" id="s-final" aria-label="It's a date">
    <div class="card">
      <p class="label" data-t="p4.label"></p>
      <div class="mascot small" id="mascot-f" aria-hidden="true"></div>
      <h1 class="title" tabindex="-1" data-t="p4.title"></h1>
      <div class="recap">
        <div class="recap-row"><span class="opt-emoji" id="r-emoji" aria-hidden="true"></span><div><strong id="r-option"></strong><small id="r-place"></small></div></div>
        <div class="recap-row"><span class="opt-emoji" aria-hidden="true">🌙</span><div><strong id="r-when"></strong><small id="r-date"></small></div></div>
      </div>
      <h2 class="section-label" data-t="p4.countdown_label"></h2>
      <div class="countdown" id="countdown">
        <div><b id="cd-h">0</b><span>hours</span></div>
        <div><b id="cd-m">00</b><span>minutes</span></div>
      </div>
      <a class="btn btn-wa btn-block" id="btn-wa" href="#" target="_blank" rel="noopener"><span aria-hidden="true">💬</span><span data-t="p4.whatsapp_button"></span></a>
      <p class="closing" data-t="p4.closing"></p>
      <p class="signature" id="signature"></p>
      <button class="link-btn" id="btn-replay" type="button">replay the letter</button>
    </div>
  </section>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
</svg>

<script>
/* =========================================================
   CONFIG : everything personal lives here
   ========================================================= */
const CONFIG = {
  name: "Ayouya",
  from: "Ayoub",
  date: "2026-09-16",            // the day of the date (YYYY-MM-DD)
  when: "Tonight",               // how the day is written in the texts
  times: ["19:00", "21:00"],
  mascot: "bear",                // bear | cat | bunny
  options: [
    { emoji: "🍽️", title: "Little Mama", place: "Dinner out", note: "Someone else does the dishes" },
    { emoji: "🥪", title: "Tuna sandwiches at the beach", place: "Picnic by the sea", note: "Five-star view, ten-dirham sandwich" },
    { emoji: "🍩", title: "Sweet treats at the beach", place: "Sugar run, then the sea", note: "Dessert first. Always." },
    { emoji: "🍗", title: "Home date", place: "Chicken suprême by chef Ayoub", note: "Your favorite. I'm cooking." }
  ]
};

/* Texts validated by Ayoub (strategy and wording: Astra, adapted to tonight) */
const TEXT = {
  letter: "For {NAME}",
  p1: {
    label: "A little letter for you",
    tap_hint: "Tap the heart to open",
    wink: "This envelope is on its best behavior."
  },
  p2: {
    label: "For you, {NAME}",
    title: "Can I take you on a date?",
    subtitle: "(Saying no is allowed. The No button just disagrees.)",
    yes: "Yes",
    no: "No",
    no_messages: [
      "Oh! A tiny escape.",
      "The button thinks this is exercise.",
      "Getting tired. Tiny legs.",
      "Okay, staying here now."
    ],
    turned_line: "Oops. The No button changed its mind 🙈"
  },
  p3: {
    label: "Perfect",
    title: "Here's the plan",
    intro: "Tonight's the night.\nYou pick the rest. Very important job.",
    options_label: "What sounds good?",
    time_label: "What time works for you?",
    back_note: "Back before 23:30 for your sister, promise",
    confirm: "Confirm our date",
    missing_choice_hint: "One little thing: pick an option and a time."
  },
  p4: {
    label: "It's a date",
    title: "Let the happy countdown begin",
    countdown_label: "Our date starts in",
    whatsapp_button: "Open our plan in WhatsApp",
    closing: "The envelope can relax now.\nSee you tonight,",
    countdown_done: "It's date time! 💖"
  },
  whatsapp_message: "It's a date! {DAY} at {TIME}.\nMy pick: {OPTION}.\nBring your best bad joke 🙂"
};

/* ========================================================= */
const $ = s => document.querySelector(s);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HEART_D = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
const haptic = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} };
const rand = (a, b) => a + Math.random() * (b - a);

const [Y, M, D] = CONFIG.date.split("-").map(Number);
const dateLabel = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long" }).format(new Date(Y, M - 1, D));
const VARS = { NAME: CONFIG.name, HIS_NAME: CONFIG.from, DAY: CONFIG.when };
const slotTime = t => { const [hh, mm] = t.split(":").map(Number); return new Date(Y, M - 1, D, hh, mm).getTime(); };

function fill(str, vars) {
  return String(str).replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
}
function pick(path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), TEXT);
}
document.querySelectorAll("[data-t]").forEach(el => {
  const v = pick(el.dataset.t);
  if (typeof v === "string") el.textContent = fill(v, VARS);
});
$("#day-label").textContent = CONFIG.when + " · " + dateLabel;
$("#signature").textContent = "♥ " + CONFIG.from;

/* ---------- background hearts ---------- */
(() => {
  const bg = $(".bg-hearts");
  const n = reduced ? 0 : 14;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.style.left = rand(0, 96) + "%";
    s.style.setProperty("--s", rand(12, 28).toFixed(0) + "px");
    s.style.opacity = rand(0.25, 0.6).toFixed(2);
    s.style.animationDuration = rand(10, 20).toFixed(1) + "s";
    s.style.animationDelay = (-rand(0, 20)).toFixed(1) + "s";
    s.innerHTML = '<svg viewBox="0 0 24 24"><use href="#heart"/></svg>';
    bg.appendChild(s);
  }
})();

/* ---------- mascot ---------- */
function mascot(kind, mood) {
  const O = "#4a2338", body = kind === "bear" ? "#f3cba8" : "#ffffff", inner = "#ffb3c8";
  const sw = 'stroke="' + O + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
  let ears = "";
  if (kind === "bear") ears =
    `<circle cx="56" cy="58" r="21" fill="${body}" ${sw}/><circle cx="56" cy="58" r="9" fill="${inner}"/>` +
    `<circle cx="144" cy="58" r="21" fill="${body}" ${sw}/><circle cx="144" cy="58" r="9" fill="${inner}"/>`;
  if (kind === "cat") ears =
    `<path d="M50 86 L56 30 L98 58 Z" fill="${body}" ${sw}/><path d="M62 70 L65 46 L84 58 Z" fill="${inner}"/>` +
    `<path d="M150 86 L144 30 L102 58 Z" fill="${body}" ${sw}/><path d="M138 70 L135 46 L116 58 Z" fill="${inner}"/>`;
  if (kind === "bunny") ears =
    `<g transform="rotate(-10 78 44)"><ellipse cx="78" cy="22" rx="16" ry="42" fill="${body}" ${sw}/><ellipse cx="78" cy="26" rx="6.5" ry="27" fill="${inner}"/></g>` +
    `<g transform="rotate(10 122 44)"><ellipse cx="122" cy="22" rx="16" ry="42" fill="${body}" ${sw}/><ellipse cx="122" cy="26" rx="6.5" ry="27" fill="${inner}"/></g>`;

  let eyes = "";
  if (mood === "happy") eyes = `<path d="M69 106 Q78 95 87 106 M113 106 Q122 95 131 106" fill="none" ${sw}/>`;
  if (mood === "plead") eyes =
    `<circle cx="78" cy="104" r="10" fill="${O}"/><circle cx="122" cy="104" r="10" fill="${O}"/>` +
    `<circle cx="74.5" cy="100" r="3.6" fill="#fff"/><circle cx="118.5" cy="100" r="3.6" fill="#fff"/>` +
    `<circle cx="81.5" cy="108" r="1.8" fill="#fff"/><circle cx="125.5" cy="108" r="1.8" fill="#fff"/>` +
    `<path d="M66 88 L84 83 M134 88 L116 83" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;
  if (mood === "love") eyes =
    `<path d="${HEART_D}" fill="#ff4d85" transform="translate(66 92)"/>` +
    `<path d="${HEART_D}" fill="#ff4d85" transform="translate(110 92)"/>`;

  const snout = kind === "bear" ? `<ellipse cx="100" cy="126" rx="21" ry="15" fill="#fbe4d2"/>` : "";
  const nose = kind === "bear"
    ? `<ellipse cx="100" cy="119" rx="7.5" ry="5.5" fill="${O}"/>`
    : `<path d="M94.5 116 H105.5 L100 122 Z" fill="#ff7aa3" stroke="${O}" stroke-width="2.5" stroke-linejoin="round"/>`;
  let mouth = `<path d="M91 128 Q95.5 134 100 128 Q104.5 134 109 128" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;
  if (mood === "plead") mouth = `<ellipse cx="100" cy="132" rx="4.5" ry="5.5" fill="${O}"/>`;
  if (mood === "love") mouth = `<path d="M90 127 Q100 141 110 127 Z" fill="${O}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>`;
  const whiskers = kind === "cat"
    ? `<path d="M60 120 L38 115 M60 127 L38 130 M140 120 L162 115 M140 127 L162 130" stroke="${O}" stroke-width="3" stroke-linecap="round"/>`
    : "";
  const blush = `<ellipse cx="62" cy="124" rx="10" ry="6" fill="#ff8fb0" opacity=".55"/><ellipse cx="138" cy="124" rx="10" ry="6" fill="#ff8fb0" opacity=".55"/>`;
  const heart = `<path d="${HEART_D}" fill="#ff5d8f" stroke="${O}" stroke-width="2.6" stroke-linejoin="round" transform="translate(81 158) scale(1.6)"/>`;
  const arms = `<ellipse cx="74" cy="178" rx="13" ry="11" fill="${body}" ${sw}/><ellipse cx="126" cy="178" rx="13" ry="11" fill="${body}" ${sw}/>`;

  return `<svg viewBox="0 -30 200 246" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="182" rx="54" ry="32" fill="${body}" ${sw}/>
    ${ears}
    <circle cx="100" cy="108" r="58" fill="${body}" ${sw}/>
    ${snout}${blush}${eyes}${nose}${mouth}${whiskers}
    ${heart}${arms}
  </svg>`;
}
function setMood(el, mood) {
  el.innerHTML = mascot(CONFIG.mascot, mood);
  el.classList.remove("wobble");
  void el.offsetWidth;
  if (!reduced) el.classList.add("wobble");
  setTimeout(() => el.classList.remove("wobble"), 520);
}
$("#mascot-q").innerHTML = mascot(CONFIG.mascot, "happy");
$("#mascot-f").innerHTML = mascot(CONFIG.mascot, "love");

/* ---------- effects (hearts) ---------- */
const fx = (() => {
  const c = $("#fx"), ctx = c.getContext("2d"), shape = new Path2D(HEART_D);
  const colors = ["#ff5d8f", "#ff8fb0", "#ffb3c8", "#e2437a", "#ffd1dc"];
  let W = 0, H = 0, dpr = 1, parts = [], running = false, last = 0, acc = 0, rainUntil = 0, rainRate = 0;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + "px"; c.style.height = H + "px";
  }
  resize();
  addEventListener("resize", resize);
  function start() {
    if (running) return;
    running = true; last = performance.now();
    requestAnimationFrame(tick);
  }
  function burst(x, y, n) {
    n = reduced ? Math.min(n, 6) : n;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(3, 9);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, g: 0.2, size: rand(10, 24), rot: rand(-0.6, 0.6), vr: rand(-0.08, 0.08), life: 1, decay: rand(0.012, 0.022), color: colors[i % colors.length] });
    }
    start();
  }
  function rain(ms, perSecond) {
    rainUntil = performance.now() + ms;
    rainRate = reduced ? Math.min(perSecond, 2) : perSecond;
    start();
  }
  function tick(now) {
    const dt = Math.min(50, now - last) / 16.67;
    last = now;
    if (now < rainUntil) {
      acc += rainRate * dt / 60;
      while (acc >= 1) {
        acc -= 1;
        parts.push({ x: rand(0, W), y: -24, vx: rand(-0.3, 0.3), vy: rand(1.3, 3), g: 0.004, size: rand(10, 24), rot: rand(-0.5, 0.5), vr: rand(-0.03, 0.03), life: 1, decay: 0, sway: rand(0, 6.28), color: colors[Math.floor(rand(0, colors.length))] });
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => {
      p.vy += p.g * dt;
      p.x += (p.vx + (p.sway !== undefined ? Math.sin(now / 650 + p.sway) * 0.45 : 0)) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > H + 40) return false;
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(p.size / 24, p.size / 24);
      ctx.translate(-12, -12);
      ctx.fillStyle = p.color;
      ctx.fill(shape);
      ctx.restore();
      return true;
    });
    if (parts.length || now < rainUntil) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  return { burst, rain };
})();
function burstFrom(el, n) {
  const r = el.getBoundingClientRect();
  fx.burst(r.left + r.width / 2, r.top + r.height / 2, n);
}

/* ---------- navigation ---------- */
let current = $(".screen.active");
const onEnter = {};
function show(id, instant) {
  const next = document.getElementById(id);
  if (!next || next === current) return;
  const prev = current;
  if (instant) {
    prev.style.transition = next.style.transition = "none";
    requestAnimationFrame(() => requestAnimationFrame(() => { prev.style.transition = next.style.transition = ""; }));
  } else {
    prev.classList.add("leaving");
    setTimeout(() => prev.classList.remove("leaving"), 700);
  }
  prev.classList.remove("active");
  next.scrollTop = 0;
  next.classList.add("active");
  current = next;
  const t = next.querySelector(".title");
  if (t) setTimeout(() => t.focus({ preventScroll: true }), instant ? 0 : 650);
  if (onEnter[id]) onEnter[id]();
}

/* ---------- 1. envelope ---------- */
const envelope = $("#envelope");
envelope.addEventListener("click", () => {
  if (envelope.classList.contains("open")) return;
  envelope.classList.add("open");
  $("#env-stage").classList.add("opened");
  haptic();
  burstFrom($("#seal"), 16);
  setTimeout(() => $("#flap").classList.add("behind"), 300);
  setTimeout(() => show("s-question"), 2000);
});

/* ---------- 2. question ---------- */
const btnYes = $("#btn-yes"), btnNo = $("#btn-no"), noMsg = $("#no-msg"), mascotQ = $("#mascot-q");
let noTries = 0, lastPress = -1e9, turned = false, accepted = false, noBase = null, noTarget = null;

function say(text) {
  noMsg.textContent = text;
  noMsg.classList.remove("pop");
  void noMsg.offsetWidth;
  noMsg.classList.add("pop");
}
function overlaps(x, y, w, h, r, pad) {
  return !(x > r.right + pad || x + w < r.left - pad || y > r.bottom + pad || y + h < r.top - pad);
}
function escapeNo() {
  if (!noBase) noBase = btnNo.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight, w = noBase.width, h = noBase.height;
  const top = 24, side = 14, bottom = 28;
  const from = noTarget || { x: noBase.left, y: noBase.top };
  const yes = btnYes.getBoundingClientRect();
  const texts = [noMsg, ...document.querySelectorAll("#s-question .label, #s-question .title, #s-question .subtitle")]
    .map(el => el.getBoundingClientRect());
  const ok = (x, y) => x >= side && x <= vw - w - side && y >= top && y <= vh - h - bottom &&
    !overlaps(x, y, w, h, yes, 16) && texts.every(r => !overlaps(x, y, w, h, r, 4));
  let spot = null;
  for (let i = 0; i < 120 && !spot; i++) {
    const a = rand(0, Math.PI * 2), dist = rand(80, 170);
    const x = from.x + Math.cos(a) * dist, y = from.y + Math.sin(a) * dist;
    if (ok(x, y)) spot = { x, y };
  }
  for (let i = 0; i < 120 && !spot; i++) {
    const x = rand(side, vw - w - side), y = rand(top, vh - h - bottom);
    if (ok(x, y)) spot = { x, y };
  }
  if (!spot) spot = { x: side, y: top };
  noTarget = spot;
  btnNo.style.setProperty("--nx", (spot.x - noBase.left).toFixed(1) + "px");
  btnNo.style.setProperty("--ny", (spot.y - noBase.top).toFixed(1) + "px");
}
function pressNo(e) {
  if (turned || accepted) return;
  if (e && e.cancelable) e.preventDefault();
  const now = performance.now();
  if (now - lastPress < 380) return;
  lastPress = now;
  haptic();
  if (noTries < 4) {
    noTries += 1;
    escapeNo();
    say(TEXT.p2.no_messages[noTries - 1]);
    if (noTries === 1) mascotQ.innerHTML = mascot(CONFIG.mascot, "plead");
    else setMood(mascotQ, "plead");
    btnYes.classList.remove("pulse");
    void btnYes.offsetWidth;
    btnYes.classList.add("pulse");
    return;
  }
  turned = true;
  btnNo.classList.add("turning");
  setTimeout(() => {
    btnNo.textContent = TEXT.p2.yes;
    btnNo.classList.add("turned");
  }, 180);
  setTimeout(() => btnNo.classList.remove("turning"), 400);
  say(TEXT.p2.turned_line);
  setMood(mascotQ, "happy");
}
function acceptYes(btn) {
  if (accepted) return;
  accepted = true;
  haptic();
  burstFrom(btn, 28);
  setMood(mascotQ, "love");
  noMsg.textContent = "";
  setTimeout(() => show("s-plan"), 900);
}
btnNo.addEventListener("pointerdown", pressNo);
btnNo.addEventListener("click", e => {
  if (performance.now() - lastPress < 700) return;
  if (turned) acceptYes(btnNo);
  else pressNo(e);
});
btnYes.addEventListener("click", () => acceptYes(btnYes));
addEventListener("resize", () => {
  if (turned) return;
  noBase = null; noTarget = null;
  btnNo.style.removeProperty("--nx");
  btnNo.style.removeProperty("--ny");
});

/* ---------- 3. plan ---------- */
let selOpt = -1, selTime = -1;
function radio(container, items, render, onPick, isDisabled) {
  container.innerHTML = "";
  items.forEach((item, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", "false");
    render(b, item);
    if (isDisabled && isDisabled(item)) { b.disabled = true; container.appendChild(b); return; }
    b.addEventListener("click", () => {
      container.querySelectorAll('[role="radio"]').forEach(x => x.setAttribute("aria-checked", "false"));
      b.setAttribute("aria-checked", "true");
      haptic();
      onPick(i);
      $("#plan-hint").textContent = "";
    });
    container.appendChild(b);
  });
}
radio($("#options"), CONFIG.options, (b, o) => {
  b.className = "opt";
  b.setAttribute("aria-label", o.title + ", " + o.place);
  b.innerHTML = `<span class="opt-emoji" aria-hidden="true"></span><span class="opt-text"><strong></strong><small></small>${o.note ? "<em></em>" : ""}</span><span class="opt-check" aria-hidden="true">✓</span>`;
  b.querySelector(".opt-emoji").textContent = o.emoji;
  b.querySelector("strong").textContent = o.title;
  b.querySelector("small").textContent = o.place;
  if (o.note) b.querySelector("em").textContent = o.note;
}, i => { selOpt = i; });
radio($("#times"), CONFIG.times, (b, t) => {
  b.className = "time";
  b.textContent = t;
}, i => { selTime = i; }, t => Date.now() > slotTime(t) + 30 * 60 * 1000);

const KEY = "little-letter-v1";
function save(state) { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
function clearSaved() { try { localStorage.removeItem(KEY); } catch (e) {} }

$("#btn-confirm").addEventListener("click", e => {
  const btn = e.currentTarget;
  if (selOpt < 0 || selTime < 0) {
    $("#plan-hint").textContent = TEXT.p3.missing_choice_hint;
    btn.classList.remove("shake");
    void btn.offsetWidth;
    btn.classList.add("shake");
    haptic();
    return;
  }
  save({ confirmed: true, date: CONFIG.date, title: CONFIG.options[selOpt].title, time: CONFIG.times[selTime] });
  haptic();
  burstFrom(btn, 30);
  setTimeout(() => show("s-final"), 600);
});

/* ---------- 4. final ---------- */
let countdownTimer = null;
function startCountdown(time) {
  const target = slotTime(time);
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      const box = $("#countdown");
      if (box) {
        const done = document.createElement("p");
        done.className = "countdown-done";
        done.textContent = TEXT.p4.countdown_done;
        box.replaceWith(done);
      }
      clearInterval(countdownTimer);
      return;
    }
    const minutes = Math.ceil(diff / 60000);
    $("#cd-h").textContent = Math.floor(minutes / 60);
    $("#cd-m").textContent = String(minutes % 60).padStart(2, "0");
  }
  clearInterval(countdownTimer);
  tick();
  countdownTimer = setInterval(tick, 5000);
}
onEnter["s-final"] = () => {
  const o = CONFIG.options[selOpt], time = CONFIG.times[selTime];
  $("#r-emoji").textContent = o.emoji;
  $("#r-option").textContent = o.title;
  $("#r-place").textContent = o.place;
  $("#r-when").textContent = CONFIG.when + " at " + time;
  $("#r-date").textContent = dateLabel;
  const msg = fill(TEXT.whatsapp_message, { OPTION: o.title, DAY: CONFIG.when, TIME: time, NAME: CONFIG.name, HIS_NAME: CONFIG.from });
  $("#btn-wa").href = "https://wa.me/?text=" + encodeURIComponent(msg);
  startCountdown(time);
  fx.rain(6000, 16);
};
$("#btn-replay").addEventListener("click", () => {
  clearSaved();
  location.replace(location.pathname);
});

/* ---------- resume a confirmed answer ---------- */
(() => {
  if (/[?&]reset\b/.test(location.search)) { clearSaved(); return; }
  const s = load();
  if (!s || !s.confirmed || s.date !== CONFIG.date) return;
  const i = CONFIG.options.findIndex(o => o.title === s.title);
  const t = CONFIG.times.indexOf(s.time);
  if (i < 0 || t < 0) return;
  selOpt = i; selTime = t;
  show("s-final", true);
})();
</script>
</body>
</html>
